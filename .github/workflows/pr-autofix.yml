name: Claude Auto-Fix

on:
  workflow_run:
    workflows: ["PR Validation"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  auto-fix:
    name: Fix PR Failures
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const prs = context.payload.workflow_run.pull_requests;
            if (prs.length === 0) {
              core.setFailed('No PR found for this workflow run');
              return;
            }
            core.setOutput('pr_number', prs[0].number);
            core.setOutput('head_ref', context.payload.workflow_run.head_branch);

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}

      - name: Get failure logs
        id: logs
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const failedJobs = jobs.data.jobs.filter(j => j.conclusion === 'failure');
            let logs = '';
            for (const job of failedJobs) {
              const jobLogs = await github.rest.actions.downloadJobLogsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                job_id: job.id,
              });
              logs += `=== ${job.name} ===\n${jobLogs.data}\n`;
            }
            // Truncate to avoid hitting input limits
            const truncated = logs.slice(-10000);
            core.setOutput('failure_logs', truncated);

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            The CI validation failed on PR #${{ steps.pr.outputs.pr_number }}.
            Analyze the failure logs below and fix the issues.

            Rules:
            - Read the CLAUDE.md file for project conventions
            - Only fix what is broken — do not refactor or add unrelated changes
            - Run `cd api && ./gradlew compileKotlin && ./gradlew ktlintCheck && ./gradlew test` to verify fixes before committing
            - Commit with format: `fix(<scope>): <description>` and include `Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>`
            - Stage files by name, never `git add .`

            Failure logs:
            ${{ steps.logs.outputs.failure_logs }}
          claude_args: "--max-turns 10"
