build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 40
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
  CyclomaticComplexMethod:
    threshold: 12
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 15

style:
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
  UnusedParameter:
    active: true
  WildcardImport:
    active: true
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 4
  ForbiddenComment:
    active: false

naming:
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  MatchingDeclarationName:
    active: false

potential-bugs:
  UnnecessarySafeCall:
    active: true
  UselessPostfixExpression:
    active: true

performance:
  SpreadOperator:
    active: false

empty-blocks:
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|ignore|expected'
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true
