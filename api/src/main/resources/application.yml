spring:
  application:
    name: privacy-alert-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/privacyalert}
    username: ${DB_USER:dev}
    password: ${DB_PASSWORD:dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production-must-be-at-least-256-bits}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  hibp:
    api-key: ${HIBP_API_KEY:}
    base-url: https://haveibeenpwned.com/api/v3

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
