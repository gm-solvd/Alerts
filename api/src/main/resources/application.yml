spring:
  application:
    name: privacy-alert-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/privacyalert}
    username: ${DB_USER:dev}
    password: ${DB_PASSWORD:dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production-must-be-at-least-256-bits}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  hibp:
    api-key: ${HIBP_API_KEY:}
    enabled: false
    base-url: https://haveibeenpwned.com/api/v3
  xon:
    enabled: false
    base-url: https://api.xposedornot.com
  catalog-sync:
    enabled: false
    cron: "0 3 * * *"
  scanning:
    paste-monitor-enabled: true
    rate-limit-requests-per-second: 2
    rate-limit-per-domain-delay-ms: 3000
    social:
      enabled-platforms: github,stackoverflow,reddit,mastodon
  comb:
    enabled: false
    base-url: https://api.proxynova.com
  email-rep:
    enabled: false
    api-key: ${EMAIL_REP_API_KEY:}
    base-url: https://emailrep.io
  admin:
    token: ${ADMIN_TOKEN:changeme}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
