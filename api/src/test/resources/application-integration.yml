spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hs256-algorithm-minimum-32-bytes
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  hibp:
    api-key: test-key
    enabled: false
    base-url: http://localhost:9999
  xon:
    enabled: false
  catalog-sync:
    enabled: false
  scanning:
    paste-monitor-enabled: false
    rate-limit-requests-per-second: 10
    rate-limit-per-domain-delay-ms: 0
    social:
      enabled-platforms: github,stackoverflow,reddit,mastodon
  admin:
    token: test-admin-token
