spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hs256-algorithm-minimum-32-bytes
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  hibp:
    api-key: test-key
    enabled: false
    base-url: http://localhost:9999
  scanning:
    paste-monitor-enabled: false
    rate-limit-requests-per-second: 10
    rate-limit-per-domain-delay-ms: 0
    social:
      enabled-platforms: github,stackoverflow,reddit,mastodon
